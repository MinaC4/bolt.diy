apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bolt-lan-ca
  namespace: openchoreo-control-plane
spec:
  ca:
    secretName: cluster-gateway-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bolt-lan-gateway-tls
  namespace: openchoreo-control-plane
spec:
  secretName: bolt-lan-gateway-tls
  issuerRef:
    name: bolt-lan-ca
    kind: Issuer
    group: cert-manager.io
  dnsNames:
    - bolt.192.168.1.3.nip.io
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
